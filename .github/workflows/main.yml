name: Build Android Debug APK

on:
workflow_dispatch:
push:
branches: [ main ]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Locate or extract Android project
    id: loc
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p project

      # أولاً: هل يوجد مشروع Gradle مباشر داخل المستودع؟
      SETTINGS=$(find . \
        -path './.git' -prune -o \
        -path './project' -prune -o \
        -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
        -print -quit)

      # ثانياً: إن لم يوجد، ابحث عن ملف ZIP في أي مجلد
      if [ -z "$SETTINGS" ]; then
        ZIP=$(find . \
          -path './.git' -prune -o \
          -path './project' -prune -o \
          -type f -iname '*.zip' -print | \
          grep -i 'subgenius' | head -n 1 || true)

        if [ -z "$ZIP" ]; then
          ZIP=$(find . \
            -path './.git' -prune -o \
            -path './project' -prune -o \
            -type f -iname '*.zip' -print -quit)
        fi

        if [ -z "$ZIP" ]; then
          echo "::error::لم يتم العثور على مشروع Gradle أو ملف ZIP للمشروع. ارفع ملفات المشروع كاملة أو ملف ZIP إلى GitHub."
          echo "الملفات الموجودة في المستودع:"
          find . -path './.git' -prune -o -type f -print | head -n 100
          exit 1
        fi

        echo "Extracting: $ZIP"
        unzip -q -o "$ZIP" -d project

        SETTINGS=$(find project \
          -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
          -print -quit)
      fi

      if [ -z "$SETTINGS" ]; then
        echo "::error::تم العثور على الملفات، لكن لم يتم العثور على settings.gradle أو settings.gradle.kts داخل المشروع."
        find project -type f | head -n 100
        exit 1
      fi

      DIR=$(dirname "$SETTINGS")
      echo "Gradle project directory: $DIR"

      if [ ! -f "$DIR/app/build.gradle" ] && \
         [ ! -f "$DIR/app/build.gradle.kts" ]; then
        echo "::error::لم يتم العثور على app/build.gradle أو app/build.gradle.kts بجانب مشروع Gradle."
        find "$DIR" -maxdepth 3 -type f | head -n 100
        exit 1
      fi

      echo "dir=$DIR" >> "$GITHUB_OUTPUT"

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: temurin

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Accept Android SDK licenses
    shell: bash
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
        > /dev/null || true

  - name: Build Debug APK
    working-directory: ${{ steps.loc.outputs.dir }}
    shell: bash
    run: |
      set -euo pipefail

      if [ -f ./gradlew ]; then
        chmod +x ./gradlew
        ./gradlew :app:assembleDebug --no-daemon --stacktrace
      else
        gradle :app:assembleDebug --no-daemon --stacktrace
      fi

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: subgenius-debug-apk
      path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
